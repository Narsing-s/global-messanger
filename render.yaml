services:
  - type: web
    name: global-messenger-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev --include=optional && npm run db:generate && npm run build -w apps/server
    startCommand: npm run start -w apps/server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: global-messenger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://global-messenger-web.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/global-messenger/uploads

  - type: web
    runtime: static
    name: global-messenger-web
    plan: free
    region: singapore
    buildCommand: rm -rf node_modules apps/web/node_modules apps/web/dist && npm install --include=dev --include=optional && npm install -w apps/web --include=optional @rollup/rollup-linux-x64-gnu@4.63.1 @rollup/rollup-linux-x64-musl@4.63.1 && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://global-messenger-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: global-messenger-db
    databaseName: global_messenger
    plan: free
    region: singapore
