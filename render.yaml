services:
  - type: web
    name: global-messenger-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: global-messenger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://global-messenger-web.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/global-messenger/uploads

  - type: web
    name: global-messenger-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      - key: VITE_API_URL
        value: https://global-messenger-api.onrender.com

  - name: global-messenger-db
    databaseName: global_messenger
    plan: free
    region: singapore
