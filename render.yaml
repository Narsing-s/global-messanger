services:
  - type: web
    name: global-messenger-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: global-messenger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://global-messenger-web.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/global-messenger/uploads

  - type: web
    name: global-messenger-web
    runtime: static
    plan: free
    region: singapore
    buildCommand: rm -rf node_modules && npm install --include=dev --include=optional && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://global-messenger-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: global-messenger-db
    databaseName: global_messenger
    plan: free
    region: singapore
