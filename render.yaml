services:
  - type: web
    name: global-messenger-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npm run db:generate && npm run db:deploy && npm run build -w apps/server
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: global-messenger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: global-messenger-uploads
      mountPath: /var/data
      sizeGB: 1

  - type: static
    name: global-messenger-web
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: global-messenger-db
    databaseName: global_messenger
    plan: free
    region: singapore
