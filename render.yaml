services:
  # Single free backend service. The frontend is already deployed separately
  # (Cloudflare), so Render does not need to rebuild the web app on every push.
  - type: web
    name: global-messenger-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev --include=optional && npm run db:generate -w apps/server && npm run db:deploy -w apps/server && npm run build -w apps/server
    startCommand: npm run start -w apps/server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: global-messenger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://global-messanger.onrender.com,https://global-messenger-web.onrender.com,https://global-messenger-help-centre.onrender.com,https://web.narsingbeesetti006.workers.dev
      - key: PASSWORD_RESET_WEB_ORIGIN
        value: https://global-messanger.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/global-messenger/uploads
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_STARTTLS
        value: "false"
      - key: SMTP_USER
        value: narsingbeesetti22@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        value: Global Messenger <narsingbeesetti22@gmail.com>

  # Lightweight static Help Centre. Its build command is intentionally tiny.
  - type: web
    name: global-messenger-help-centre
    runtime: static
    plan: free
    region: singapore
    buildCommand: echo "Global Messenger Help Centre"
    staticPublishPath: support

databases:
  - name: global-messenger-db
    databaseName: global_messenger
    plan: free
    region: singapore
