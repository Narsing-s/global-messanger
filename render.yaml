services:
  - type: web
    name: global-messenger-api
    runtime: node
    # Gmail SMTP uses ports 25/465/587. Render Free blocks outbound SMTP,
    # so the backend must run on a paid web-service plan for direct Gmail SMTP.
    plan: starter
    region: singapore
    buildCommand: rm -rf apps/server/dist && npm install --include=dev --include=optional && npm run db:generate -w apps/server && npm run db:deploy -w apps/server && npm run build -w apps/server
    startCommand: npm run start -w apps/server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: global-messenger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://global-messanger.onrender.com,https://global-messenger-web.onrender.com,https://global-messanger-web-git-main-narsing-s-projects.vercel.app,https://global-messenger-web.narsingbeesetti006.workers.dev,https://global-messenger-help-centre.onrender.com
      - key: PASSWORD_RESET_WEB_ORIGIN
        value: https://global-messanger.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/global-messenger/uploads
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_STARTTLS
        value: "false"
      - key: SMTP_USER
        value: narsingbeesetti22@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        value: Global Messenger <narsingbeesetti22@gmail.com>

  - type: web
    name: global-messenger-web
    runtime: static
    plan: free
    region: singapore
    buildCommand: rm -rf node_modules apps/web/node_modules apps/web/dist && npm install --include=dev --include=optional && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://global-messanger-backend.onrender.com
    routes:
      - type: rewrite
        source: /chrome
        destination: /chrome.html
      - type: rewrite
        source: /chrome/
        destination: /chrome.html
      - type: rewrite
        source: /edge
        destination: /edge.html
      - type: rewrite
        source: /edge/
        destination: /edge.html
      - type: rewrite
        source: /install
        destination: /install.html
      - type: rewrite
        source: /install/
        destination: /install.html
      - type: rewrite
        source: /reset-password
        destination: /reset-password/index.html
      - type: rewrite
        source: /reset-password/
        destination: /reset-password/index.html
      - type: rewrite
        source: /reset-password.html
        destination: /reset-password.html
      - type: rewrite
        source: /reset-password.html/*
        destination: /reset-password.html
      - type: rewrite
        source: /reset-password/*
        destination: /reset-password/index.html
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: global-messenger-help-centre
    runtime: static
    plan: free
    region: singapore
    buildCommand: echo "Global Messenger Help Centre"
    staticPublishPath: support

databases:
  - name: global-messenger-db
    databaseName: global_messenger
    plan: free
    region: singapore
