upstream global_messenger_api { server api:4000; }
server {
  listen 80;
  client_max_body_size 50m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), display-capture=(self)" always;
  location /api/ { proxy_pass http://global_messenger_api; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /socket.io/ { proxy_pass http://global_messenger_api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /uploads/ { proxy_pass http://global_messenger_api; add_header Cache-Control "public,max-age=86400,stale-while-revalidate=604800"; }
}
