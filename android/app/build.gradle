plugins { id 'com.android.application' }

android {
    namespace 'com.globalmessenger.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.globalmessenger.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'GM_APP_URL', '"' + (project.findProperty('GM_APP_URL') ?: 'http://10.0.2.2:8080/') + '"'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
}