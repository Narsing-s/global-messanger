<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="0" y="0" width="365" height="900" fill="#f8faff" stroke="#e6eaf2"/>
  <rect x="365" y="0" width="1235" height="900" fill="#ffffff"/>

  <!-- Brand -->
  <rect x="24" y="22" width="58" height="58" rx="18" fill="#526dff"/>
  <circle cx="53" cy="51" r="18" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M40 52c5-8 10 8 15 0s10 8 15 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="98" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#15233d">Global</text>
  <text x="98" y="69" font-family="Arial,sans-serif" font-size="16" fill="#71809a">Messenger</text>
  <line x1="0" y1="105" x2="365" y2="105" stroke="#e6eaf2"/>

  <!-- User -->
  <circle cx="52" cy="145" r="25" fill="#17233c"/>
  <text x="52" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff">CH</text>
  <text x="92" y="144" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17233c">Charans</text>
  <text x="92" y="165" font-family="Arial,sans-serif" font-size="14" fill="#71809a">@charans</text>
  <text x="337" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#71809a">⇥</text>

  <!-- Search -->
  <rect x="20" y="190" width="325" height="48" rx="15" fill="#f1f4fa" stroke="#e0e5ee"/>
  <circle cx="44" cy="214" r="7" fill="none" stroke="#8794aa" stroke-width="2"/>
  <line x1="49" y1="219" x2="54" y2="224" stroke="#8794aa" stroke-width="2"/>
  <text x="68" y="220" font-family="Arial,sans-serif" font-size="15" fill="#71809a">Search people or chats</text>

  <!-- Navigation -->
  <rect x="16" y="250" width="333" height="45" rx="13" fill="#e9edff"/>
  <circle cx="40" cy="272" r="9" fill="none" stroke="#526dff" stroke-width="2"/>
  <path d="M35 278l-2 6 7-5" fill="none" stroke="#526dff" stroke-width="2"/>
  <text x="63" y="278" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#526dff">Chats</text>
  <circle cx="341" cy="272" r="11" fill="#d7ddff"/>
  <text x="341" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#526dff">0</text>
  <text x="64" y="326" font-family="Arial,sans-serif" font-size="15" fill="#71809a">New group</text>
  <text x="155" y="327" font-family="Arial,sans-serif" font-size="23" fill="#71809a">+</text>
  <text x="27" y="376" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#8a96aa">CONVERSATIONS</text>

  <!-- Empty conversations -->
  <circle cx="182" cy="492" r="24" fill="none" stroke="#9aa6bb" stroke-width="3"/>
  <path d="M166 492c5-9 10 9 16 0s11 9 16 0" fill="none" stroke="#9aa6bb" stroke-width="3"/>
  <text x="182" y="540" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#43516a">No conversations yet.</text>
  <text x="182" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#8a96aa">Search for a person or create a group.</text>

  <!-- Explore -->
  <rect x="20" y="837" width="325" height="45" rx="14" fill="#eef1f7"/>
  <text x="142" y="865" font-family="Arial,sans-serif" font-size="14" fill="#71809a">✧</text>
  <text x="160" y="865" font-family="Arial,sans-serif" font-size="14" fill="#526dff">Explore features</text>

  <!-- Welcome panel -->
  <rect x="365" y="0" width="1235" height="900" fill="#ffffff"/>
  <rect x="960" y="340" width="68" height="68" rx="21" fill="#526dff"/>
  <circle cx="994" cy="374" r="23" fill="none" stroke="#ffffff" stroke-width="4"/>
  <path d="M977 375c6-11 12 11 18 0s12 11 18 0" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="994" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#15233d">Global Messenger</text>
  <text x="994" y="488" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#7b879b">Search for anyone and start a conversation without borders.</text>
</svg>
