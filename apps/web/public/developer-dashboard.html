<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Messenger Developer Dashboard</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eef2ff}main{max-width:1100px;margin:auto;padding:28px}section{background:#151c31;border:1px solid #293554;border-radius:16px;padding:18px;margin:14px 0}input,button,textarea{padding:10px;border-radius:9px;border:1px solid #35415f;background:#0f1629;color:#fff;margin:4px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{padding:14px;border-radius:12px;background:#10172a}.muted{color:#aab5cf}pre{white-space:pre-wrap;overflow:auto}</style></head><body><main><h1>Developer Dashboard</h1><p class="muted">API keys, bots, mini apps and signed webhooks.</p><section><h2>API key</h2><input id="keyName" placeholder="Key name"><button onclick="createKey()">Create key</button><pre id="keyOut"></pre></section><section><h2>Bot</h2><input id="botName" placeholder="Bot name"><textarea id="botCode" placeholder="input => ({reply: 'Hello ' + input.name})"></textarea><button onclick="createBot()">Create bot</button></section><section><h2>Mini app</h2><input id="appName" placeholder="App name"><input id="appUrl" placeholder="https://example.com"><button onclick="createMiniApp()">Register</button></section><section><h2>Webhook</h2><input id="whName" placeholder="Webhook name"><input id="whUrl" placeholder="https://example.com/webhook"><button onclick="createWebhook()">Register</button></section><section><h2>Runtime</h2><div id="dashboard" class="grid"></div></section></main><script>const API=window.__GM_CONFIG__?.API_URL||location.origin;const token=()=>localStorage.getItem('gm_token')||'';async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{'content-type':'application/json',Authorization:'Bearer '+token(),...(o.headers||{})}});const j=await r.json();if(!r.ok)throw Error(j.message||JSON.stringify(j));return j}async function createKey(){try{const j=await api('/api/developer/keys',{method:'POST',body:JSON.stringify({name:keyName.value,scopes:['bots','miniapps','webhooks']})});keyOut.textContent=j.key;load()}catch(e){keyOut.textContent=e.message}}async function createBot(){try{await api('/api/developer/bots',{method:'POST',body:JSON.stringify({name:botName.value,code:botCode.value})});load()}catch(e){alert(e.message)}}async function createMiniApp(){try{await api('/api/developer/mini-apps',{method:'POST',body:JSON.stringify({name:appName.value,url:appUrl.value})});load()}catch(e){alert(e.message)}}async function createWebhook(){try{await api('/api/developer/webhooks',{method:'POST',body:JSON.stringify({name:whName.value,url:whUrl.value,events:['message.created','message.updated','call.ended']})});load()}catch(e){alert(e.message)}}async function load(){try{const j=await api('/api/developer/dashboard');dashboard.innerHTML='<div class="card"><b>Active API keys</b><div>'+j.activeApiKeys+'</div></div><div class="card"><b>Bots</b><div>'+j.bots.length+'</div></div><div class="card"><b>Mini apps</b><div>'+j.miniapps.length+'</div></div><div class="card"><b>Webhooks</b><div>'+j.webhooks.length+'</div></div>'}catch(e){dashboard.textContent=e.message}}load()</script></body></html>
