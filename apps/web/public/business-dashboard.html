<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Messenger Business</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eef2ff}main{max-width:1100px;margin:auto;padding:28px}section{background:#151c31;border:1px solid #293554;border-radius:16px;padding:18px;margin:14px 0}input,button{padding:10px;border-radius:9px;border:1px solid #35415f;background:#0f1629;color:#fff;margin:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{background:#10172a;padding:14px;border-radius:12px}.muted{color:#aab5cf}</style></head><body><main><h1>Business Center</h1><p class="muted">Shared inbox, agent assignment and catalog management.</p><section><h2>Shared inbox</h2><input id="inbox" placeholder="Inbox name"><input id="agents" placeholder="Agent IDs, comma separated"><button onclick="makeInbox()">Create inbox</button></section><section><h2>Catalog</h2><input id="name" placeholder="Product name"><input id="desc" placeholder="Description"><input id="price" type="number" placeholder="Price"><input id="stock" type="number" placeholder="Stock"><button onclick="addItem()">Add item</button></section><section><h2>Catalog items</h2><div id="items" class="grid"></div></section></main><script>const API=window.__GM_CONFIG__?.API_URL||location.origin;const token=()=>localStorage.getItem('gm_token')||'';async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{'content-type':'application/json',Authorization:'Bearer '+token(),...(o.headers||{})}});const j=await r.json();if(!r.ok)throw Error(j.message||JSON.stringify(j));return j}async function makeInbox(){try{await api('/api/business/inbox',{method:'POST',body:JSON.stringify({name:inbox.value,agentIds:agents.value.split(',').map(x=>x.trim()).filter(Boolean)})});alert('Inbox created')}catch(e){alert(e.message)}}async function addItem(){try{await api('/api/business/catalog',{method:'POST',body:JSON.stringify({name:name.value,description:desc.value,price:Number(price.value||0),stock:Number(stock.value||0),currency:'INR'})});load()}catch(e){alert(e.message)}}async function load(){try{const rows=await api('/api/business/catalog');items.innerHTML=rows.map(x=>'<div class="card"><b>'+x.name+'</b><p>'+((x.data&&x.data.description)||'')+'</p><strong>'+((x.data&&x.data.currency)||'INR')+' '+((x.data&&x.data.price)||0)+'</strong><div>Stock: '+((x.data&&x.data.stock)||0)+'</div></div>').join('')}catch(e){items.textContent=e.message}}load()</script></body></html>
