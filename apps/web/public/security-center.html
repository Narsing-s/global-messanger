<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Center</title><style>body{font-family:system-ui;background:#090d18;color:#eef2ff;margin:0}main{max-width:1000px;margin:auto;padding:28px}section{background:#141b2e;border:1px solid #2b3858;border-radius:16px;padding:18px;margin:14px 0}input,select,textarea,button{padding:10px;margin:4px;border-radius:8px;background:#0d1424;color:#fff;border:1px solid #3a486a}button{cursor:pointer}</style></head><body><main><h1>Security & Incident Center</h1><section><h2>Create incident</h2><select id="severity"><option>low</option><option>medium</option><option>high</option><option>critical</option></select><input id="type" placeholder="Incident type"><textarea id="summary" placeholder="What happened?"></textarea><button onclick="createIncident()">Create</button></section><section><h2>Runtime security posture</h2><pre id="runtime">Loading...</pre></section></main><script>const API=window.__GM_CONFIG__?.API_URL||location.origin;const token=()=>localStorage.getItem('gm_token')||'';async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{'content-type':'application/json',Authorization:'Bearer '+token(),...(o.headers||{})}});const j=await r.json();if(!r.ok)throw Error(j.message||JSON.stringify(j));return j}async function createIncident(){try{await api('/api/security/incidents',{method:'POST',body:JSON.stringify({severity:severity.value,type:type.value,summary:summary.value})});alert('Incident created')}catch(e){alert(e.message)}}api('/api/platform/runtime').then(x=>runtime.textContent=JSON.stringify(x,null,2)).catch(e=>runtime.textContent=e.message)</script></body></html>
