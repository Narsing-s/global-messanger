<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — Global Messenger</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:#060a13;color:#f8fafc;display:grid;place-items:center;padding:20px}.card{width:min(460px,100%);padding:34px;border:1px solid #334155;border-radius:24px;background:#0f172a;box-shadow:0 25px 80px #0008}h1{margin:0 0 10px}.sub{color:#a8b4c9;line-height:1.55;margin-bottom:24px}label{display:block;font-weight:700;margin:16px 0 7px}input{width:100%;padding:14px;border:1px solid #334155;border-radius:12px;background:#0b1220;color:#fff;font-size:15px}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.6}.msg{margin-top:16px;padding:13px;border-radius:10px}.error{background:#3b1720;color:#fecdd3}.success{background:#123425;color:#bbf7d0}.back{display:block;text-align:center;margin-top:18px;color:#9fb5e9;text-decoration:none}</style></head><body><main class="card"><h1 id="title">Create a new password</h1><p class="sub" id="sub">Enter your new password and confirm it. This secure link can only be used once.</p><form id="form"><label for="password">New password</label><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="At least 8 characters"><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="Enter password again"><div id="message" class="msg" hidden></div><button id="button" type="submit">Update password</button></form><a class="back" id="back" href="/">← Back to Global Messenger</a></main><script>(()=>{const q=new URLSearchParams(location.search),token=q.get('token')||q.get('resetToken')||'',form=document.getElementById('form'),password=document.getElementById('password'),confirm=document.getElementById('confirm'),message=document.getElementById('message'),button=document.getElementById('button'),back=document.getElementById('back');const apiBase=()=>{const c=window.__GM_CONFIG__&&window.__GM_CONFIG__.API_URL;if(c)return c.replace(/\/$/,'');if(location.hostname==='localhost'||location.hostname==='127.0.0.1')return 'http://127.0.0.1:4000';return location.origin.replace(/\/$/,'')};const webBase=()=>{if(location.hostname==='localhost'||location.hostname==='127.0.0.1')return 'http://127.0.0.1:5173';return location.origin.replace(/\/$/,'')};back.href=webBase();const show=(t,c)=>{message.hidden=false;message.className='msg '+c;message.textContent=t};if(!token){form.hidden=true;show('This reset link is missing its security token. Request a new reset email.','error');return}form.addEventListener('submit',async e=>{e.preventDefault();message.hidden=true;if(password.value.length<8)return show('Password must be at least 8 characters.','error');if(password.value!==confirm.value)return show('Passwords do not match.','error');button.disabled=true;button.textContent='Updating password…';try{const r=await fetch(apiBase()+'/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:password.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Unable to reset password');form.hidden=true;document.getElementById('title').textContent='Password updated';document.getElementById('sub').textContent='Your password has been updated securely. You can now sign in with the new password.';show(d.message||'Password reset successfully.','success');button.disabled=true;button.textContent='Password updated'}catch(e){show(e.message||'Unable to reset password.','error');button.disabled=false;button.textContent='Update password'}})})()</script></body></html>
