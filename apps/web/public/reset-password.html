<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Reset password — Global Messenger</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 0,#243b7a 0,transparent 36%),radial-gradient(circle at 100% 100%,#153b5c 0,transparent 35%),#060a13;color:#f8fafc}.card{width:min(460px,100%);padding:34px;border:1px solid rgba(148,163,184,.18);border-radius:28px;background:rgba(15,23,42,.94);box-shadow:0 30px 100px rgba(0,0,0,.45);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#4f46e5);font-size:23px;box-shadow:0 10px 30px rgba(37,99,235,.28)}.brand b{display:block;font-size:18px}.brand span{display:block;color:#94a3b8;font-size:13px;margin-top:3px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:#60a5fa;margin-bottom:9px}.title{font-size:30px;line-height:1.12;margin:0 0 9px}.sub{color:#a8b4c9;line-height:1.55;margin:0 0 25px}label{display:block;font-size:14px;font-weight:700;margin:17px 0 7px}input{width:100%;padding:14px 15px;border:1px solid #334155;border-radius:13px;background:#0b1220;color:#fff;font-size:15px;outline:0;transition:.15s}input:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(96,165,250,.12)}.hint{margin:8px 0 0;color:#718096;font-size:12px}.meter{height:4px;margin-top:9px;border-radius:99px;background:#1e293b;overflow:hidden}.meter i{display:block;height:100%;width:0;transition:.2s}.actions{margin-top:22px}.primary{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-size:15px;font-weight:750;cursor:pointer;transition:transform .12s,opacity .12s}.primary:hover:not(:disabled){transform:translateY(-1px)}button:disabled{opacity:.62;cursor:wait}.msg{margin-top:16px;padding:13px 14px;border-radius:12px;line-height:1.45;font-size:14px}.error{background:#3b1720;color:#fecdd3;border:1px solid #71313c}.success{background:#123425;color:#bbf7d0;border:1px solid #236441}.back{display:block;text-align:center;margin-top:18px;color:#9fb5e9;text-decoration:none;font-size:14px}.hidden{display:none}.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="logo">💬</div><div><b>Global Messenger</b><span>Secure account recovery</span></div></div>
    <div class="eyebrow">Account security</div>
    <h1 class="title" id="title">Create a new password</h1>
    <p class="sub" id="sub">Choose a strong password for your account. This secure link expires in 30 minutes and can only be used once.</p>
    <form id="form">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="Enter your new password">
      <div class="meter"><i id="meter"></i></div>
      <div class="hint">Use at least 8 characters.</div>
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="Re-enter your new password">
      <div id="message" class="msg hidden" role="status" aria-live="polite"></div>
      <div class="actions"><button id="button" class="primary" type="submit">Update password</button></div>
    </form>
    <a class="back" href="/">← Back to Global Messenger</a>
  </main>
<script>
(() => {
  const token = new URLSearchParams(location.search).get('token') || '';
  const API = location.hostname === 'localhost' || location.hostname === '127.0.0.1' ? 'http://127.0.0.1:4000' : 'https://global-messenger-api.onrender.com';
  const form=document.getElementById('form'), password=document.getElementById('password'), confirm=document.getElementById('confirm'), message=document.getElementById('message'), button=document.getElementById('button'), meter=document.getElementById('meter');
  const show=(text,type)=>{message.textContent=text;message.className='msg '+type};
  password.addEventListener('input',()=>{const n=password.value.length;meter.style.width=Math.min(n/12*100,100)+'%';});
  if(!token){form.classList.add('hidden');document.getElementById('title').textContent='Reset link unavailable';document.getElementById('sub').textContent='This password reset link is missing its security token. Request a new reset email from Global Messenger.';show('No reset token was provided.','error');return;}
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const next=password.value, again=confirm.value;
    message.className='msg hidden';
    if(next.length<8)return show('Password must contain at least 8 characters.','error');
    if(next!==again)return show('Passwords do not match. Please check both fields.','error');
    button.disabled=true;button.innerHTML='<span class="spinner"></span>Updating password…';
    try{
      const r=await fetch(API+'/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:next})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.message||('Password reset failed ('+r.status+').'));
      form.classList.add('hidden');
      document.getElementById('title').textContent='Password updated';
      document.getElementById('sub').textContent='Your new password is saved securely. You can now sign in to Global Messenger.';
      show(d.message||'Password reset successfully. You can now log in with your new password.','success');
      setTimeout(()=>{location.href='/';},1000);
    }catch(err){show(err instanceof Error?err.message:'Unable to reset password. Please try again.','error');button.disabled=false;button.textContent='Update password';}
  });
})();
</script>
</body>
</html>
