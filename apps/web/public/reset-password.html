<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Reset password — Global Messenger</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#172554 0,#0b1020 45%,#060912 100%);color:#eef2ff}.card{width:min(440px,100%);padding:32px;border:1px solid #26324d;border-radius:24px;background:rgba(18,26,43,.96);box-shadow:0 24px 80px rgba(0,0,0,.4)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#2563eb;font-size:22px}.brand b{display:block;font-size:18px}.brand span{display:block;color:#94a3b8;font-size:13px;margin-top:2px}.title{font-size:28px;line-height:1.15;margin:0 0 8px}.sub{color:#aab6cf;line-height:1.55;margin:0 0 24px}label{display:block;font-size:14px;font-weight:650;margin:16px 0 7px}input{width:100%;padding:14px;border:1px solid #34425f;border-radius:12px;background:#0d1526;color:#fff;font-size:15px;outline:0}input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.12)}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:transform .12s,opacity .12s}button:hover:not(:disabled){transform:translateY(-1px)}button:disabled{opacity:.65;cursor:wait}.msg{margin-top:16px;padding:13px 14px;border-radius:11px;line-height:1.45;font-size:14px}.error{background:#3a1820;color:#ffb4bd;border:1px solid #74313d}.success{background:#123425;color:#a7f3c2;border:1px solid #236441}.back{display:block;text-align:center;margin-top:18px;color:#9fb5e9;text-decoration:none;font-size:14px}.hidden{display:none}.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="logo">🔐</div><div><b>Global Messenger</b><span>Secure account recovery</span></div></div>
    <h1 class="title" id="title">Create a new password</h1>
    <p class="sub" id="sub">Enter a new password below. Your reset link is valid for 30 minutes and can only be used once.</p>
    <form id="form">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="At least 8 characters">
      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="Enter it again">
      <div id="message" class="msg hidden" role="status" aria-live="polite"></div>
      <button id="button" type="submit">Reset password</button>
    </form>
    <a class="back" href="/">← Back to Global Messenger</a>
  </main>
<script>
(() => {
  const token = new URLSearchParams(location.search).get('token') || '';
  const API = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? 'http://127.0.0.1:4000'
    : 'https://global-messenger-api.onrender.com';
  const form=document.getElementById('form'), password=document.getElementById('password'), confirm=document.getElementById('confirm'), message=document.getElementById('message'), button=document.getElementById('button');
  const show=(text,type)=>{message.textContent=text;message.className='msg '+type};
  if(!token){form.classList.add('hidden');document.getElementById('title').textContent='Invalid reset link';document.getElementById('sub').textContent='This link is missing its reset token. Please request a new password reset email.';show('No password reset token was provided.','error');return;}
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const next=password.value, again=confirm.value;
    message.className='msg hidden';
    if(next.length<8)return show('Password must be at least 8 characters.','error');
    if(next!==again)return show('Passwords do not match.','error');
    button.disabled=true;button.innerHTML='<span class="spinner"></span>Updating password…';
    try{
      const r=await fetch(API+'/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:next})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.message||('Password reset failed ('+r.status+').'));
      form.classList.add('hidden');
      document.getElementById('title').textContent='Password reset complete';
      document.getElementById('sub').textContent='Your new password has been saved. You can now sign in to Global Messenger.';
      show(d.message||'Password reset successfully. You can now log in with your new password.','success');
      setTimeout(()=>{location.href='/';},1200);
    }catch(err){show(err instanceof Error?err.message:'Unable to reset password. Please try again.','error');button.disabled=false;button.textContent='Reset password';}
  });
})();
</script>
</body>
</html>
