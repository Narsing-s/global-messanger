<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Reset password — Global Messenger</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:32px;box-shadow:0 20px 60px rgba(15,23,42,.12)}.logo{width:54px;height:54px;border-radius:16px;background:#0b1020;color:#fff;display:grid;place-items:center;font-size:25px;margin-bottom:18px}.logo:before{content:'✉'}h1{font-size:27px;margin:0 0 8px}p{color:#64748b;line-height:1.55;margin:0 0 22px}label{display:block;font-size:14px;font-weight:600;margin:14px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px;outline:none}input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}button{width:100%;border:0;border-radius:11px;padding:13px 16px;background:#2563eb;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:18px}button:disabled{opacity:.6;cursor:not-allowed}.msg{margin-top:16px;padding:12px;border-radius:10px;line-height:1.45}.error{background:#fef2f2;color:#b91c1c}.success{background:#f0fdf4;color:#166534}.back{display:block;text-align:center;margin-top:18px;color:#2563eb;text-decoration:none;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo"></div>
    <h1 id="title">Create a new password</h1>
    <p id="sub">Enter your new password and confirm it. Your Global Messenger password will be updated securely.</p>
    <form id="form">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters">
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Enter password again">
      <div id="message" class="msg" hidden></div>
      <button id="submit" type="submit">Update password</button>
    </form>
    <a id="back" class="back" href="http://127.0.0.1:5173/">← Back to Global Messenger</a>
  </main>
  <script>
    const API=window.location.origin;
    const WEB=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://127.0.0.1:5173/':'/';
    const token=new URLSearchParams(location.search).get('token')||new URLSearchParams(location.search).get('resetToken')||'';
    const form=document.getElementById('form');
    const password=document.getElementById('password');
    const confirm=document.getElementById('confirm');
    const message=document.getElementById('message');
    const submit=document.getElementById('submit');
    const back=document.getElementById('back');
    back.href=WEB;
    function show(text,type){message.hidden=false;message.className='msg '+type;message.textContent=text}
    if(!token){show('This password reset link is missing its security token. Please request a new reset email.','error');submit.disabled=true}
    form.addEventListener('submit',async e=>{
      e.preventDefault();
      message.hidden=true;
      if(password.value.length<8)return show('Password must be at least 8 characters.','error');
      if(password.value!==confirm.value)return show('Passwords do not match.','error');
      submit.disabled=true;
      submit.textContent='Updating password…';
      try{
        const r=await fetch(API+'/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:password.value})});
        const d=await r.json().catch(()=>({}));
        if(!r.ok)throw new Error(d.message||'Unable to reset password');
        form.hidden=true;
        document.getElementById('title').textContent='Password updated successfully';
        document.getElementById('sub').textContent='Your new password has been saved. You can now sign in with your new password.';
        show(d.message||'Password reset successfully.','success');
        // No automatic redirect. The user must click the Back to Global Messenger link.
      }catch(err){
        show(err.message||'Unable to reset password.','error');
        submit.disabled=false;
        submit.textContent='Update password';
      }
    });
  </script>
</body>
</html>
