    <div id="root"></div>
    <script>
      (async function () {
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(r => r.unregister()));
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.filter(k => k.startsWith('global-messenger-shell-')).map(k => caches.delete(k)));
          }
        } catch (_) {}
      })();
    </script>

    <script>
      document.addEventListener('click', function (event) {
        const target = event.target instanceof Element ? event.target : null;
        const heading = target?.closest('.chat-heading');
        if (!heading || target?.closest('.top-actions, button, a')) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        if (typeof window.__gmOpenContactInfo === 'function') window.__gmOpenContactInfo();
        else window.dispatchEvent(new CustomEvent('gm:open-contact-info'));
      }, true);
    </script>
