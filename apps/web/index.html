    <script>
      // One-to-one and group chat heading clicks always open the rich
      // Contact info / Group info panel. The three-dot menu remains separate.
      document.addEventListener('click', function (event) {
        const target = event.target instanceof Element ? event.target : null;
        const heading = target?.closest('.chat-heading');
        if (!heading || target?.closest('.top-actions, button, a')) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        if (typeof window.__gmOpenContactInfo === 'function') {
          window.__gmOpenContactInfo();
        } else {
          window.dispatchEvent(new CustomEvent('gm:open-contact-info'));
        }
      }, true);
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js?v=20260903i', { scope: '/' }).catch(() => {});
