name = "global-messenger-api"
main = "src/index.ts"
compatibility_date = "2026-08-31"

# Production values are injected by GitHub Actions from repository secrets.
# Required secrets:
#   CLOUDFLARE_API_URL      Public Worker URL used by the web build.
#   BACKEND_API_URL         Public HTTPS Fastify runtime URL.
#   CLOUDFLARE_WEB_ORIGIN   Public Cloudflare Pages/custom-domain origin.
# Never store DATABASE_URL, JWT_SECRET or other credentials in this file.
