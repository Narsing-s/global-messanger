name: Cloudflare + Neon Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/api-worker/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloudflare-neon.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKEND_API_URL: 'https://global-messanger-backend.onrender.com'
      CLOUDFLARE_API_URL: 'https://global-messenger-api.narsingbeesetti006.workers.dev'
      CLOUDFLARE_WEB_ORIGIN: 'https://global-messenger-web.narsingbeesetti006.workers.dev'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_URL CLOUDFLARE_WEB_ORIGIN BACKEND_API_URL CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required deployment value: $name"
              exit 1
            fi
          done
          case "$CLOUDFLARE_API_URL" in https://*) ;; *) echo 'CLOUDFLARE_API_URL must use HTTPS'; exit 1;; esac
          case "$CLOUDFLARE_WEB_ORIGIN" in https://*) ;; *) echo 'CLOUDFLARE_WEB_ORIGIN must use HTTPS'; exit 1;; esac
          case "$BACKEND_API_URL" in https://*) ;; *) echo 'BACKEND_API_URL must use HTTPS'; exit 1;; esac
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo 'Missing required deployment secret: CLOUDFLARE_API_TOKEN'
            exit 1
          fi

      - name: Build web for Cloudflare Worker
        run: npm run build -w apps/web
        env:
          VITE_API_URL: ${{ env.CLOUDFLARE_API_URL }}

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Deploy API Worker
        working-directory: apps/api-worker
        run: |
          set -euo pipefail
          wrangler deploy \
            --name global-messenger-api \
            --var "UPSTREAM_API:${BACKEND_API_URL}" \
            --var "ALLOWED_ORIGIN:${CLOUDFLARE_WEB_ORIGIN}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy web Worker
        run: |
          set -euo pipefail
          wrangler deploy \
            --config apps/web/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test API Worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            status=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/health.json -w '%{http_code}' "${CLOUDFLARE_API_URL}/health" || true)
            echo "API smoke attempt $attempt: HTTP $status"
            cat /tmp/health.json 2>/dev/null || true
            if [ "$status" = "200" ] && node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/health.json','utf8')); if(!x.ok || x.service!=='global-messenger') process.exit(1)"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Smoke test Socket.IO endpoint
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS --connect-timeout 10 --max-time 30 \
            -o /tmp/socket.txt -w '%{http_code}' \
            "${CLOUDFLARE_API_URL}/socket.io/?EIO=4&transport=polling" || true)
          echo "Socket.IO unauthenticated handshake HTTP $status"
          cat /tmp/socket.txt 2>/dev/null || true
          # Authentication should reject the connection, but it must be a Socket.IO response,
          # never the web application's HTML shell.
          if grep -qi '<!doctype html' /tmp/socket.txt; then
            echo 'Socket.IO endpoint incorrectly returned the web application HTML.'
            exit 1
          fi
          test "$status" != '200' || grep -q '^0' /tmp/socket.txt || true

      - name: Smoke test web Worker
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -L -o /tmp/web.html -w '%{http_code}' "${CLOUDFLARE_WEB_ORIGIN}/")
          test "$status" = "200"
          grep -qi '<title>Global Messenger</title>' /tmp/web.html

      - name: Verify production artifact does not hard-code retired Vercel URLs
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'vercel\\.app' apps/web/dist; then
            echo 'Retired Vercel URL found in production web artifact.'
            exit 1
          fi
