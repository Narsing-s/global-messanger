name: Cloudflare + Neon Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/api-worker/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloudflare-neon.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'
      CLOUDFLARE_API_URL: ${{ secrets.CLOUDFLARE_API_URL }}
      CLOUDFLARE_WEB_ORIGIN: ${{ secrets.CLOUDFLARE_WEB_ORIGIN }}
      BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Resolve production endpoints
        shell: bash
        run: |
          set -euo pipefail

          # These are public endpoints, but keeping them configurable allows
          # the same workflow to be reused for a different production backend.
          : "${BACKEND_API_URL:=https://global-messanger-backend.onrender.com}"
          : "${CLOUDFLARE_API_URL:=https://global-messenger-api.narsingbeesetti006.workers.dev}"
          : "${CLOUDFLARE_WEB_ORIGIN:=https://global-messenger-web.narsingbeesetti006.workers.dev}"

          # Normalize the backend URL defensively. GitHub Actions secrets can
          # retain an old http:// value; the public Render service is HTTPS-only.
          BACKEND_API_URL="$(printf '%s' "$BACKEND_API_URL" | sed -E 's#^http://#https://#')"
          BACKEND_API_URL="$(printf '%s' "$BACKEND_API_URL" | xargs)"

          # Remove trailing slashes to prevent // in proxy paths and CORS origin.
          BACKEND_API_URL="${BACKEND_API_URL%/}"
          CLOUDFLARE_API_URL="${CLOUDFLARE_API_URL%/}"
          CLOUDFLARE_WEB_ORIGIN="${CLOUDFLARE_WEB_ORIGIN%/}"

          {
            echo "BACKEND_API_URL=$BACKEND_API_URL"
            echo "CLOUDFLARE_API_URL=$CLOUDFLARE_API_URL"
            echo "CLOUDFLARE_WEB_ORIGIN=$CLOUDFLARE_WEB_ORIGIN"
          } >> "$GITHUB_ENV"

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_URL CLOUDFLARE_WEB_ORIGIN BACKEND_API_URL CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required deployment value: $name"
              exit 1
            fi
          done
          case "$CLOUDFLARE_API_URL" in https://*) ;; *) echo 'CLOUDFLARE_API_URL must use HTTPS'; exit 1;; esac
          case "$CLOUDFLARE_WEB_ORIGIN" in https://*) ;; *) echo 'CLOUDFLARE_WEB_ORIGIN must use HTTPS'; exit 1;; esac
          case "$BACKEND_API_URL" in https://*) ;; *) echo 'BACKEND_API_URL must use HTTPS'; exit 1;; esac
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo 'Missing required deployment secret: CLOUDFLARE_API_TOKEN'
            exit 1
          fi

      - name: Build web for Cloudflare Worker
        run: npm run build -w apps/web
        env:
          VITE_API_URL: ${{ env.CLOUDFLARE_API_URL }}

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Deploy API Worker
        working-directory: apps/api-worker
        run: |
          wrangler deploy \
            --name global-messenger-api \
            --var "UPSTREAM_API:${BACKEND_API_URL}" \
            --var "ALLOWED_ORIGIN:${CLOUDFLARE_WEB_ORIGIN}" \
            --account-id "${CLOUDFLARE_ACCOUNT_ID}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy web Worker
        run: |
          wrangler deploy \
            --config apps/web/wrangler.toml \
            --account-id "${CLOUDFLARE_ACCOUNT_ID}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test API Worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            status=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/health.json -w '%{http_code}' "${CLOUDFLARE_API_URL}/health" || true)
            echo "API smoke attempt $attempt: HTTP $status"
            cat /tmp/health.json 2>/dev/null || true
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Smoke test web Worker
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -L -o /tmp/web.html -w '%{http_code}' "${CLOUDFLARE_WEB_ORIGIN}/")
          test "$status" = "200"
          grep -qi '<title>Global Messenger</title>' /tmp/web.html

      - name: Verify production artifact does not hard-code retired Vercel URLs
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'vercel\.app' apps/web/dist; then
            echo 'Retired Vercel URL found in production web artifact.'
            exit 1
          fi

      # Force a fresh production deployment whenever this workflow itself is repaired.
      # This marker intentionally lives in the workflow so the push trigger runs it.
