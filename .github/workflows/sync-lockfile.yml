name: Sync npm lockfile

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'apps/*/package.json'
      - '.github/workflows/sync-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-lockfile
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sync package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "ci: sync package-lock with workspaces"
          git push
