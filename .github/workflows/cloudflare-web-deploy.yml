name: Deploy Global Messenger Web to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/cloudflare-web-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app against Cloudflare D1 API
        env:
          VITE_API_URL: https://global-messenger-api.narsingbeesetti006.workers.dev
        run: npm run build
      - name: Deploy static web Worker
        shell: bash
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#Bearer}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#bearer}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#\"}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN%\"}"
          export CLOUDFLARE_API_TOKEN
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler@4.131.1 deploy
