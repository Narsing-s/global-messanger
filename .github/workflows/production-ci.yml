name: Production CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: global_messenger_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d global_messenger_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/global_messenger_ci
      JWT_SECRET: ci-only-secret
      WEB_ORIGIN: http://127.0.0.1:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Doctor
        run: npm run doctor

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate production migrations
        run: npm run db:deploy

      - name: Build web
        run: npm run build -w apps/web

      - name: Build server
        run: npm run build -w apps/server

      - name: Verify generated production assets
        run: |
          test -f apps/web/dist/index.html
          test -f apps/server/dist/index.js
          echo "Production build verification passed"
