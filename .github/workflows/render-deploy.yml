name: Render Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger and verify Render API deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Render deploy hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deployment triggered successfully."

      - name: Explain missing deploy hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "RENDER_DEPLOY_HOOK_URL is not configured."
          echo "Render auto-deploy remains the fallback."

      - name: Wait for Render deployment to become healthy
        env:
          API_URL: https://global-messanger-backend.onrender.com
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' "$API_URL/ready" || true)"
            echo "Attempt $attempt/30: /ready returned HTTP $status"
            if [ "$status" = "200" ]; then
              cat /tmp/ready.json
              echo
              echo "Render API is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Render API did not become ready within 5 minutes."
          exit 1
