name: Deploy Cloudflare Messenger API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cloudflare/package.json
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Ensure D1 database exists
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          DB_JSON="$(npx wrangler d1 list --json)"
          DB_ID="$(echo "$DB_JSON" | jq -r '.[] | select(.name=="global-messenger") | .uuid' | head -n1)"
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            DB_JSON="$(npx wrangler d1 create global-messenger --json)"
            DB_ID="$(echo "$DB_JSON" | jq -r '.uuid // .result.uuid')"
          fi
          test -n "$DB_ID" && test "$DB_ID" != "null"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml
          echo "D1 database configured: $DB_ID"
      - name: Apply D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          npx wrangler d1 migrations apply global-messenger --remote
      - name: Set JWT secret
        shell: bash
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          printf '%s' "${{ secrets.GM_JWT_SECRET }}" | npx wrangler secret put JWT_SECRET
      - name: Deploy Worker
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          npx wrangler deploy
