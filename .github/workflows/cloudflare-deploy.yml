name: Deploy Cloudflare Messenger API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cloudflare/package.json
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Ensure D1 database exists
        shell: bash
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#Bearer}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#bearer}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#\"}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN%\"}"
          export CLOUDFLARE_API_TOKEN
          test -n "$CLOUDFLARE_API_TOKEN"
          DB_JSON="$(npx wrangler d1 list)"
          DB_ID="$(echo "$DB_JSON" | grep -E 'global-messenger' | grep -Eo '[0-9a-fA-F-]{36}' | head -n1 || true)"
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            DB_CREATE_OUTPUT="$(npx wrangler d1 create global-messenger)"
            DB_ID="$(echo "$DB_CREATE_OUTPUT" | grep -Eio '[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}' | head -n1 || true)"
          fi
          test -n "$DB_ID" && test "$DB_ID" != "null"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml
          echo "D1 database configured: $DB_ID"
      - name: Apply D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#Bearer}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#bearer}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#\"}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN%\"}"
          export CLOUDFLARE_API_TOKEN
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 migrations apply global-messenger --remote
      - name: Set JWT secret
        shell: bash
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#Bearer}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#bearer}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#\"}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN%\"}"
          export CLOUDFLARE_API_TOKEN
          test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s' "${{ secrets.GM_JWT_SECRET }}" | npx wrangler secret put JWT_SECRET
      - name: Deploy Worker
        shell: bash
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#Bearer}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#bearer}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#\"}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN%\"}"
          export CLOUDFLARE_API_TOKEN
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deploy

# redeploy trigger 2026-09-30
