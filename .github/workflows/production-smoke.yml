name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'render.yaml'
      - 'apps/server/**'
      - 'apps/web/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEB_URL: https://global-messanger.onrender.com
      API_URL: https://global-messanger-backend.onrender.com
      HELP_URL: https://global-messenger-help-centre.onrender.com
    steps:
      - name: Check public endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 "$WEB_URL/" -o /tmp/web.html
          grep -qi 'Global Messenger' /tmp/web.html
          curl --fail --silent --show-error --location --max-time 30 "$API_URL/health" -o /tmp/health.json
          node -e "const x=require('/tmp/health.json'); if(!x.ok) process.exit(1); console.log('health', x)"
          curl --fail --silent --show-error --location --max-time 30 "$API_URL/ready" -o /tmp/ready.json
          node -e "const x=require('/tmp/ready.json'); if(!x.ok || !x.ready) process.exit(1); console.log('ready', x)"
          curl --fail --silent --show-error --location --max-time 30 "$HELP_URL/" -o /tmp/help.html
          grep -qiE 'Help|Support|Global Messenger' /tmp/help.html

      - name: Check PWA assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 "$WEB_URL/manifest.webmanifest" -o /tmp/manifest.json
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('/tmp/manifest.json', 'utf8'));
          if (m.name !== 'Global Messenger' || m.display !== 'standalone') throw new Error('Invalid production PWA manifest');
          console.log('manifest ok');
          NODE
          curl --fail --silent --show-error --location --max-time 30 "$WEB_URL/sw.js" | grep -q "addEventListener('fetch'"
          curl --fail --silent --show-error --location --max-time 30 "$WEB_URL/install.html" | grep -q 'Get Global Messenger'

      - name: Verify support API preflight
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/options.txt -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://global-messenger-help-centre.onrender.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            "$API_URL/api/support/requests")
          test "$status" = '204' || test "$status" = '200'
          grep -qi 'access-control-allow-origin' /tmp/options.txt || true
          echo "support preflight HTTP $status"

      - name: Verify unauthenticated API protection
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/protected.txt -w '%{http_code}' "$API_URL/api/conversations")
          test "$status" = '401' || test "$status" = '403'
          echo "protected endpoint HTTP $status"
