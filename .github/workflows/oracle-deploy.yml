name: Oracle Always Free Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'deploy/oracle/**'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/server/prisma/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT }}
    steps:
      - name: Check Oracle deployment configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${ORACLE_HOST}" ]] && missing+=(ORACLE_HOST)
          [[ -z "${ORACLE_USER}" ]] && missing+=(ORACLE_USER)
          [[ -z "${ORACLE_SSH_KEY}" ]] && missing+=(ORACLE_SSH_KEY)

          if (( ${#missing[@]} > 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Oracle deployment skipped: missing GitHub Actions secrets: ${missing[*]}"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Oracle deployment credentials are configured."
          fi

      - name: Deploy to Oracle VM
        if: steps.config.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.ORACLE_HOST }}
          username: ${{ env.ORACLE_USER }}
          key: ${{ env.ORACLE_SSH_KEY }}
          port: ${{ env.ORACLE_SSH_PORT || '22' }}
          command_timeout: 10m
          script: |
            set -e
            if [ ! -d "$HOME/global-messenger" ]; then
              git clone https://github.com/Narsing-s/global-messanger.git "$HOME/global-messenger"
            fi
            cd "$HOME/global-messenger"
            git fetch origin main
            git reset --hard origin/main
            cd deploy/oracle
            docker compose up -d --build
            docker compose exec -T api npx prisma migrate deploy --schema /app/apps/server/prisma/schema.prisma
            docker compose ps

      - name: Report skipped deployment
        if: steps.config.outputs.configured != 'true'
        run: |
          echo "Oracle deployment was skipped because its SSH secrets are not configured."
          echo "Production CI remains independent and can still validate the application."
