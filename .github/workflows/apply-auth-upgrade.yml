name: Apply email authentication upgrade

on:
  push:
    paths:
      - scripts/upgrade-auth.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply upgrade
        run: node scripts/upgrade-auth.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/advanced.ts apps/web/src/main.tsx apps/web/src/styles.css
          git commit -m "feat(auth): add email registration login and password recovery"
          git push
