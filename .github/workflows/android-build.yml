name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Build web app
        run: npm run build -w apps/web
      - name: Add Android platform
        working-directory: apps/web
        run: npx cap add android
      - name: Sync Capacitor
        working-directory: apps/web
        run: npx cap sync android
      - name: Configure Android permissions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          permissions = [
              'android.permission.INTERNET',
              'android.permission.CAMERA',
              'android.permission.RECORD_AUDIO',
              'android.permission.MODIFY_AUDIO_SETTINGS',
              'android.permission.POST_NOTIFICATIONS'
          ]
          for perm in permissions:
              line = f'    <uses-permission android:name="{perm}" />\n'
              if perm not in text:
                  text = text.replace('<application', line + '    <application', 1)
          p.write_text(text)
          PY
      - name: Configure release signing
        working-directory: apps/web/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo 'ANDROID_SIGNING_AVAILABLE=true' >> "$GITHUB_ENV"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            cat > keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            python - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          if not p.exists():
              p = Path('app/build.gradle.kts')
          text = p.read_text()
          if 'keystore.properties' not in text:
              if p.suffix == '.kts':
                  block = '''\nimport java.util.Properties\nval signingProps = Properties()\nval signingFile = rootProject.file("keystore.properties")\nif (signingFile.exists()) signingFile.inputStream().use { signingProps.load(it) }\nandroid {\n    signingConfigs {\n        create("release") {\n            if (signingFile.exists()) {\n                storeFile = rootProject.file(signingProps["storeFile"] as String)\n                storePassword = signingProps["storePassword"] as String\n                keyAlias = signingProps["keyAlias"] as String\n                keyPassword = signingProps["keyPassword"] as String\n            }\n        }\n    }\n    buildTypes { getByName("release") { signingConfig = signingConfigs.getByName("release") } }\n}\n'''
              else:
                  block = '''\nimport java.util.Properties\ndef signingProps = new Properties()\ndef signingFile = rootProject.file("keystore.properties")\nif (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }\nandroid {\n    signingConfigs {\n        release {\n            if (signingFile.exists()) {\n                storeFile rootProject.file(signingProps['storeFile'])\n                storePassword signingProps['storePassword']\n                keyAlias signingProps['keyAlias']\n                keyPassword signingProps['keyPassword']\n            }\n        }\n    }\n    buildTypes { release { signingConfig signingConfigs.release } }\n}\n'''
              p.write_text(text + block)
          PY
          else
            echo 'Release signing secrets are not configured; building an unsigned release APK/AAB for installation/testing.'
            echo 'ANDROID_SIGNING_AVAILABLE=false' >> "$GITHUB_ENV"
          fi
      - name: Build release APK and AAB
        working-directory: apps/web/android
        run: ./gradlew assembleRelease bundleRelease --stacktrace
      - name: Verify release packages
        shell: bash
        env:
          ANDROID_SIGNING_AVAILABLE: ${{ env.ANDROID_SIGNING_AVAILABLE }}
        run: |
          set -euo pipefail
          RELEASE_APK=$(find apps/web/android/app/build/outputs/apk -type f -name '*.apk' | grep '/release/' | head -n 1)
          RELEASE_AAB=$(find apps/web/android/app/build/outputs/bundle -type f -name '*.aab' | grep '/release/' | head -n 1)
          test -n "$RELEASE_APK"
          test -n "$RELEASE_AAB"
          mkdir -p release-output
          cp "$RELEASE_APK" release-output/Global-Messenger.apk
          cp "$RELEASE_AAB" release-output/Global-Messenger.aab
          file release-output/Global-Messenger.apk release-output/Global-Messenger.aab
          unzip -t release-output/Global-Messenger.apk >/dev/null
          unzip -t release-output/Global-Messenger.aab >/dev/null
          if [[ "$ANDROID_SIGNING_AVAILABLE" == 'true' ]]; then
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose release-output/Global-Messenger.apk
          else
            echo 'APK is intentionally unsigned because no persistent Android release keystore is configured.'
          fi
          sha256sum release-output/Global-Messenger.apk release-output/Global-Messenger.aab
      - name: Upload Android packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-messenger-android-release
          path: release-output/*
          if-no-files-found: error
      - name: Publish Android latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_API="repos/$GITHUB_REPOSITORY/releases/tags/android-latest"
          if ! gh api "$RELEASE_API" >/dev/null 2>&1; then
            gh release create android-latest --repo "$GITHUB_REPOSITORY" --title 'Global Messenger Android — Latest' --notes 'Maintained latest Android build. The APK is the direct installation package; the AAB is for Google Play Console.' --target "$GITHUB_SHA"
          fi
          RELEASE_ID=$(gh api "$RELEASE_API" --jq '.id')
          for asset in Global-Messenger.apk global-messenger.apk Global-Messenger.aab global-messenger.aab; do
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate --jq ".[] | select(.name == \"$asset\") | .id" | while read -r ASSET_ID; do
              if [[ -n "$ASSET_ID" ]]; then gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"; fi
            done
          done
          gh release upload android-latest release-output/Global-Messenger.apk --repo "$GITHUB_REPOSITORY"
          gh release upload android-latest release-output/Global-Messenger.aab --repo "$GITHUB_REPOSITORY"
          gh release view android-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'Global-Messenger.apk'
          gh release view android-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'Global-Messenger.aab'
      - name: Publish versioned Android release
        if: github.ref == 'refs/heads/main' && env.ANDROID_SIGNING_AVAILABLE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "require('./package.json').version")
          VERSION_TAG="android-v${APP_VERSION}-build-${GITHUB_RUN_NUMBER}"
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION_TAG" >/dev/null 2>&1; then
            gh release create "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" --title "Global Messenger Android v${APP_VERSION} (Build ${GITHUB_RUN_NUMBER})" --notes "Production Android release generated from main by GitHub Actions." --target "$GITHUB_SHA"
          fi
          EXISTING_ASSETS=$(gh release view "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if ! grep -Fxq 'Global-Messenger.apk' <<<"$EXISTING_ASSETS"; then gh release upload "$VERSION_TAG" release-output/Global-Messenger.apk --repo "$GITHUB_REPOSITORY"; fi
          if ! grep -Fxq 'Global-Messenger.aab' <<<"$EXISTING_ASSETS"; then gh release upload "$VERSION_TAG" release-output/Global-Messenger.aab --repo "$GITHUB_REPOSITORY"; fi
      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_SIGNING_AVAILABLE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Global Messenger ${{ github.ref_name }}
          body: Production Android release generated by GitHub Actions.
          files: |
            release-output/Global-Messenger.apk
            release-output/Global-Messenger.aab
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
