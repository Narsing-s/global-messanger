name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - '.github/workflows/android-build.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build -w apps/web
      - name: Add Android platform
        working-directory: apps/web
        run: npx cap add android
      - name: Sync Capacitor
        working-directory: apps/web
        run: npx cap sync android
      - name: Configure Android permissions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          permissions = ['android.permission.INTERNET','android.permission.CAMERA','android.permission.RECORD_AUDIO','android.permission.POST_NOTIFICATIONS']
          for perm in permissions:
              if perm not in text:
                  text = text.replace('<application', f'    <uses-permission android:name="{perm}" />\n    <application', 1)
          p.write_text(text)
          PY
      - name: Build debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --stacktrace
      - name: Prepare downloadable APK
        shell: bash
        run: |
          DEBUG_APK=$(find apps/web/android/app/build/outputs/apk -type f -name '*.apk' | grep '/debug/' | head -n 1)
          test -n "$DEBUG_APK"
          cp "$DEBUG_APK" global-messenger.apk
          ls -lh global-messenger.apk
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-messenger-android
          path: global-messenger.apk
          if-no-files-found: error
      - name: Publish latest Android APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Global Messenger Android APK
          body: Latest installable Android APK for Global Messenger.
          files: global-messenger.apk
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
