name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build -w apps/web
      - name: Add Android platform
        working-directory: apps/web
        run: npx cap add android
      - name: Sync Capacitor
        working-directory: apps/web
        run: npx cap sync android
      - name: Configure Android permissions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          permissions = [
              'android.permission.INTERNET',
              'android.permission.CAMERA',
              'android.permission.RECORD_AUDIO',
              'android.permission.POST_NOTIFICATIONS'
          ]
          for perm in permissions:
              line = f'    <uses-permission android:name="{perm}" />\n'
              if perm not in text:
                  text = text.replace('<application', line + '    <application', 1)
          p.write_text(text)
          PY
      - name: Configure release signing
        working-directory: apps/web/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo 'ANDROID_SIGNING_AVAILABLE=true' >> "$GITHUB_ENV"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            cat > keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            python - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          if not p.exists():
              p = Path('app/build.gradle.kts')
          text = p.read_text()
          if 'keystore.properties' not in text:
              if p.suffix == '.kts':
                  block = '''\nimport java.util.Properties\nval signingProps = Properties()\nval signingFile = rootProject.file("keystore.properties")\nif (signingFile.exists()) signingFile.inputStream().use { signingProps.load(it) }\nandroid {\n    signingConfigs {\n        create("release") {\n            if (signingFile.exists()) {\n                storeFile = file(signingProps["storeFile"] as String)\n                storePassword = signingProps["storePassword"] as String\n                keyAlias = signingProps["keyAlias"] as String\n                keyPassword = signingProps["keyPassword"] as String\n            }\n        }\n    }\n    buildTypes { getByName("release") { signingConfig = signingConfigs.getByName("release") } }\n}\n'''
              else:
                  block = '''\nimport java.util.Properties\ndef signingProps = new Properties()\ndef signingFile = rootProject.file("keystore.properties")\nif (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }\nandroid {\n    signingConfigs {\n        release {\n            if (signingFile.exists()) {\n                storeFile file(signingProps['storeFile'])\n                storePassword signingProps['storePassword']\n                keyAlias signingProps['keyAlias']\n                keyPassword signingProps['keyPassword']\n            }\n        }\n    }\n    buildTypes { release { signingConfig signingConfigs.release } }\n}\n'''
              p.write_text(text + block)
          PY
          else
            echo 'Release signing secrets are not configured; building an unsigned release APK/AAB for installation/testing.'
            echo 'ANDROID_SIGNING_AVAILABLE=false' >> "$GITHUB_ENV"
          fi
      - name: Build release APK and AAB
        working-directory: apps/web/android
        run: ./gradlew assembleRelease bundleRelease --stacktrace
      - name: Verify release packages
        shell: bash
        env:
          ANDROID_SIGNING_AVAILABLE: ${{ env.ANDROID_SIGNING_AVAILABLE }}
        run: |
          set -euo pipefail
          RELEASE_APK=$(find apps/web/android/app/build/outputs/apk -type f -name '*.apk' | grep '/release/' | head -n 1)
          RELEASE_AAB=$(find apps/web/android/app/build/outputs/bundle -type f -name '*.aab' | grep '/release/' | head -n 1)
          test -n "$RELEASE_APK"
          test -n "$RELEASE_AAB"
          mkdir -p release-output
          cp "$RELEASE_APK" release-output/Global-Messenger.apk
          cp "$RELEASE_AAB" release-output/Global-Messenger.aab
          file release-output/Global-Messenger.apk release-output/Global-Messenger.aab
          unzip -t release-output/Global-Messenger.apk >/dev/null
          unzip -t release-output/Global-Messenger.aab >/dev/null
          if [[ "$ANDROID_SIGNING_AVAILABLE" == 'true' ]]; then
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose release-output/Global-Messenger.apk
          else
            echo 'APK is intentionally unsigned because no persistent Android release keystore is configured.'
          fi
          sha256sum release-output/Global-Messenger.apk release-output/Global-Messenger.aab
      - name: Upload Android packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-messenger-android-release
          path: release-output/*
          if-no-files-found: error
      - name: Publish Android latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Global Messenger Android Latest
          body: |
            ## Global Messenger Android Latest

            Latest Android build from the `main` branch.

            - **Global-Messenger.apk** — direct Android installation.
            - **Global-Messenger.aab** — Google Play Console upload bundle.

            The install page points to this release, so every successful main-branch Android build refreshes the downloadable APK.
          files: |
            release-output/Global-Messenger.apk
            release-output/Global-Messenger.aab
          make_latest: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_SIGNING_AVAILABLE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Global Messenger ${{ github.ref_name }}
          body: |
            ## Global Messenger ${{ github.ref_name }}

            Production Android release generated by GitHub Actions.

            ### Downloads
            - **Global-Messenger.apk** — direct Android installation.
            - **Global-Messenger.aab** — Google Play Console upload bundle.

            The APK is signed and verified during the release workflow.
          files: |
            release-output/Global-Messenger.apk
            release-output/Global-Messenger.aab
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
