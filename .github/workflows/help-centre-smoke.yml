name: Help Centre and Supabase Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://wozvcabjepdjkcuasqko.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_cvUQ6H24JbYRZEcLdmjw-w_f-YvDn2_
      HELP_URL: https://global-messenger-help-centre.onrender.com
    steps:
      - name: Check Supabase Auth endpoint
        run: |
          curl --fail --silent --show-error -I \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/auth/v1/health"

      - name: Check Help Centre is reachable
        run: |
          curl --fail --silent --show-error -I "$HELP_URL/"
