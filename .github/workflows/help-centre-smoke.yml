name: Help Centre Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check API health
        run: |
          curl --fail --silent --show-error \
            https://global-messanger-backend.onrender.com/health

      - name: Check Help Centre is reachable
        run: |
          curl --fail --silent --show-error -I \
            https://global-messenger-help-centre.onrender.com/

      - name: Check Help Centre CORS preflight
        run: |
          curl --fail --silent --show-error -D /tmp/headers -o /dev/null \
            -X OPTIONS \
            -H 'Origin: https://global-messenger-help-centre.onrender.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            https://global-messanger-backend.onrender.com/api/support/requests
          grep -i '^access-control-allow-origin: https://global-messenger-help-centre.onrender.com' /tmp/headers
          grep -i '^access-control-allow-methods:' /tmp/headers
