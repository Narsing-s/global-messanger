name: QA Browser E2E

on:
  push:
    branches:
      - 'qa/**'
      - 'main'
  pull_request:
  workflow_dispatch:

jobs:
  docker-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WEB_URL: http://127.0.0.1:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static regression checks
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "function document(" apps/web/public apps/web/src; then exit 1; fi
          if grep -R "vercel.com/sso-api" apps/web/public apps/web/src; then exit 1; fi
          test -f apps/web/public/sw.js
          test -f apps/web/index.html
          grep -q "auth-operation-fix.js" apps/web/index.html
          grep -q "mobile-auth-input-fix.js" apps/web/index.html

      - name: Build and start production Docker stack
        shell: bash
        run: |
          set -euo pipefail
          cat > .env <<'EOF'
          POSTGRES_DB=global_messenger_qa
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=qa-postgres-local-only
          JWT_SECRET=qa-jwt-local-only-change-me
          WEB_ORIGIN=http://127.0.0.1:8080
          PASSWORD_RESET_WEB_ORIGIN=http://127.0.0.1:8080
          WEB_PORT=8080
          API_URL=http://127.0.0.1:8080
          APP_VERSION=qa
          GIT_COMMIT=ci
          EOF
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS "$WEB_URL/healthz" >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Docker browser acceptance
        env:
          BASE_URL: ${{ env.WEB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          const base = process.env.BASE_URL;
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const target of [
                {name: 'desktop', viewport: {width: 1440, height: 900}},
                {name: 'mobile', viewport: {width: 390, height: 844}, isMobile: true}
              ]) {
                const page = await browser.newPage(target);
                const errors = [];
                page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
                page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });
                const root = await page.request.get(`${base}/`);
                if (!root.ok()) throw new Error(`${target.name}: root HTTP ${root.status()}`);
                if (!String(root.headers()['cache-control'] || '').includes('no-store')) throw new Error(`${target.name}: root is cacheable`);
                await page.goto(`${base}/`, {waitUntil: 'networkidle', timeout: 30000});
                if (!(await page.locator('body').innerText()).includes('Global Messenger')) throw new Error(`${target.name}: app shell did not render`);
                const manifest = await page.request.get(`${base}/manifest.webmanifest`);
                if (!manifest.ok()) throw new Error(`${target.name}: manifest HTTP ${manifest.status()}`);
                const manifestJson = await manifest.json();
                if (manifestJson.name !== 'Global Messenger' || manifestJson.display !== 'standalone') throw new Error(`${target.name}: invalid manifest`);
                const sw = await page.request.get(`${base}/sw.js`);
                if (!sw.ok()) throw new Error(`${target.name}: service worker HTTP ${sw.status()}`);
                if (!String(sw.headers()['cache-control'] || '').includes('no-store')) throw new Error(`${target.name}: service worker is cacheable`);
                if (!(await sw.text()).includes("self.addEventListener('fetch'")) throw new Error(`${target.name}: missing fetch handler`);
                const apiHealth = await page.request.get(`${base}/api/health`);
                if (![200, 404].includes(apiHealth.status())) throw new Error(`${target.name}: unexpected API health HTTP ${apiHealth.status()}`);
                await page.reload({waitUntil: 'networkidle', timeout: 30000});
                if (!(await page.locator('body').innerText()).includes('Global Messenger')) throw new Error(`${target.name}: reload failed`);
                if (errors.length) throw new Error(`${target.name}: browser errors\n${errors.join('\n')}`);
                console.log(`PASS ${target.name}`);
                await page.close();
              }
            } finally { await browser.close(); }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Docker diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=300

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v --remove-orphans
