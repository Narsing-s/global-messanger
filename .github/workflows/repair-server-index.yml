name: Repair server index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Repair server index from known-good commit') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good server index and add Help Centre CORS
        run: |
          git show 7debfdc60fcf826f84e9ad263acd531710c1ec1d:apps/server/src/index.ts > apps/server/src/index.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/server/src/index.ts')
          s = p.read_text()
          s = s.replace("'http://localhost:5173,https://web.narsingbeesetti006.workers.dev'", "'http://localhost:5173,https://web.narsingbeesetti006.workers.dev,https://global-messenger-help-centre.onrender.com'")
          old = "  const isNativeApp =\n    /^capacitor:\\/\\/localhost$/.test(origin) ||\n    /^ionic:\\/localhost$/.test(origin);\n\n  return configured.includes(origin) || isLocalDev || isNativeApp;"
          new = "  const isNativeApp =\n    /^capacitor:\\/\\/localhost$/.test(origin) ||\n    /^ionic:\\/localhost$/.test(origin);\n\n  const isHelpCentre = origin === 'https://global-messenger-help-centre.onrender.com';\n\n  return configured.includes(origin) || isLocalDev || isNativeApp || isHelpCentre;"
          if old not in s:
              raise SystemExit('Expected CORS block was not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Commit repaired file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/server/src/index.ts
          git commit -m 'Repair server index from known-good commit' || exit 0
          git push

      - name: Repair workflow marker
        run: echo 'one-time repair trigger'
